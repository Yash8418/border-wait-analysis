name: Publish dashboard

# Publishes site/ to GitHub Pages. Runs when the dashboard or its data changes,
# or by hand from the Actions tab. One-time setup: Settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_run:
    workflows: ["Fetch border wait data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # after a data refresh, publish the commit the fetch job just pushed
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
